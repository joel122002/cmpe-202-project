services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:///./data/vacation_rental.db
      AUTH_SECRET: change-me-in-development
      FRONTEND_ORIGIN: http://localhost:5173
      SEED_DEMO_DATA: "true"
    volumes:
      - backend-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      - backend

volumes:
  backend-data:
